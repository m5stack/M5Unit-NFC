; For CapCC1101 / CapCC1101NFC (SPI, ST25R3916)
;
; Every env here extends [Cardputer]: Cardputer-Adv builds exactly like the plain Cardputer
; (generic ESP32-S3), and M5.getBoard() tells board_M5CardputerADV apart at runtime. A separate
; [CardputerADV] section would only repeat the same settings.

; --------------------------------
; UnitTest
; --------------------------------
[env:-----------------------------------------------cc_separator0]


; CapCC1101 (SPI) - Cardputer only
[env:test_CapCC1101_CardputerADV]
extends=Cardputer, option_release, arduino_latest
build_flags = ${Cardputer.build_flags}
  ${option_release.build_flags}
  -D USING_CAP_CC1101
lib_deps = ${Cardputer.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_st25r3916

[env:-----------------------------------------------cc_separator1]
; --------------------------------
; Examples
; --------------------------------
; CapCC1101
; ---- NFC-A
[env:CapCC1101_NFCA_Detect_CardputerADV_Arduino_latest]
extends=Cardputer, option_release, arduino_latest
build_src_filter = +<*> -<.git/> -<.svn/>
  +<../examples/UnitUnified/NFCA/Detect/>
  -<../examples/UnitUnified/NFCA/Detect/build/>
  -<../examples/UnitUnified/NFCA/Detect/managed_components/>
build_flags = ${Cardputer.build_flags}
  ${option_release.build_flags}
  -D USING_CAP_CC1101

